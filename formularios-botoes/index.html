<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF8">
        <title>Formulário de inscrição de Workshop</title>
    </head>
    <body>
        <main>
            <section id="inscricao">

                <h2>Ficha de Inscrição no Workshop</h2>
                <p>Preencha os dados abaixo:</p>
                <form action="#" method="post">
                    <fieldset>
                        <legend>
                            <b>1 - Informações Pessoais</b>
                        </legend>
                        <label for="campo-nome">Nome Completo: </label><br>
                        <input type="text" name="nome_completo" id="campo-nome" placeholder="Informe seu nome" required size="40"/><br>

                        <label for="campo-email">Email Pessoal: </label><br>
                        <input type="email" name="email_pessoal" id="campo-email" placeholder="Informe seu E-mail" required size="40"/><br>

                        <label for="campo-telefone">Número de Telefone: </label><br>
                        <input type="tel" name="numero_telefone" id="campo-telefone" placeholder="(XX) X XXXX-XXXX" required/><br>

                        <label for="campo-data">Data de Nascimento: </label><br>
                        <input type="date" name="data_nascimento" id="campo-data"/><br>
                    </fieldset>
                    <br>
                    <fieldset>
                        <legend>
                            <b>2 - Preferências do Workshop</b>
                        </legend>
                        <label for="campo-curso">Selecione o Workshop desejado</label><br>
                        <select name="selecao_cursos" id="campo-curso" required>
                            <option value="">Selecione uma opção</option>
                            <option value="front">Front-end</option>
                            <option value="back">Back-end</option>
                            <option value="mobile">Mobile</option>
                        </select><br>

                        <p><b>Selecione o turno do Workshop</b></p>

                        <input type="radio" name="turbo_escolhido" id="campo-turno-manha" value="manha" checked>
                        <label for="campo-turno-manha">Turno da Manhã</label>

                        <input type="radio" name="turbo_escolhido" id="campo-turno-tarde" value="tarde">
                        <label for="campo-turno-tarde">Turno da Tarde</label>

                        <input type="radio" name="turbo_escolhido" id="campo-turno-noite" value="noite">
                        <label for="campo-turno-noite">Turno da Noite</label>

                        <p><b>Tópicos de Interesse</b></p>
                        <input type="checkbox" name="topicos[]" id="topico_html" value="html">
                        <label for="topico_html">HTML</label>

                        <input type="checkbox" name="topicos[]" id="topico_css" value="css">
                        <label for="topico_css">CSS</label>

                        <input type="checkbox" name="topicos[]" id="topico_js" value="js">
                        <label for="topico_js">JS</label>
                        <br>
                        <br>
                        <label for="campo-observacao">Observação ou Dúvidas</label><br>
                        <textarea name="observacoes_adicionais" id="campo-observacao" rows="4" cols="50" placeholder="Informe aqui dados adicionais pertinentes à inscrição..."></textarea>
                    </fieldset>
                    <br>
                    <br>
                    <button type="submit"><b>Confirmar meu cadastro</b></button>
                    <button type="reset"><b>Limpar formulário</b></button>
                </form>

            </section>
        </main>
    </body>
</html>
